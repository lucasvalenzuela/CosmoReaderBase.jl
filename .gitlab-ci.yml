before_script:
  - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY_MACHINE_USER" | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - |
    julia -e '
      using Pkg
      Registry.add("General")
      Registry.add(RegistrySpec(url="git@gitlab.com:juliacosmosims/CosmoSimsRegistry.git"))'
.script:
  script:
    - |
      julia --project=@. -e '
        using Pkg
        Pkg.build()
        Pkg.test(coverage=true)'
.coverage:
  coverage: /Test coverage (\d+\.\d+%)/
  after_script:
    - |
      julia -e '
        using Pkg
        Pkg.add("Coverage")
        using Coverage
        c, t = get_summary(process_folder())
        using Printf
        @printf "Test coverage %.2f%%\n" 100c / t'
        Codecov.submit(Codecov.process_folder())
Julia 1.7:
  image: julia:1.7
  extends:
    - .script
    - .coverage
pages:
  image: julia:1.7
  stage: deploy
  script:
    - apt-get -qq update; apt-get -y install git
    - |
      julia --project=docs -e '
        using Pkg
        Pkg.develop(PackageSpec(path=pwd()))
        Pkg.instantiate()
        using Documenter: doctest
        using CosmoReaderBase
        doctest(CosmoReaderBase)
        include("docs/make.jl")'
    - mkdir -p public
    - mv docs/build public/dev
  artifacts:
    paths:
      - public
  only:
    - main
