.script:
  script:
    - SSH_AUTH_SOCK=/tmp/ssh_agent.sock
    - |
      ssh-agent -a $SSH_AUTH_SOCK > /dev/null
      ssh-add - <<< "$SSH_PRIVATE_KEY_MACHINE_USER"
    - |
      julia --project=@. -e '
        using Pkg
        Pkg.build()
        Pkg.test(coverage=true)'
.coverage:
  coverage: /Test coverage (\d+\.\d+%)/
  after_script:
    - |
      julia -e '
        using Pkg
        Pkg.add("Coverage")
        using Coverage
        c, t = get_summary(process_folder())
        using Printf
        @printf "Test coverage %.2f%%\n" 100c / t'
Julia 1.7:
  image: julia:1.7
  extends:
    - .script
    - .coverage
pages:
  image: julia:1.7
  stage: deploy
  script:
    - |
      julia --project=docs -e '
        using Pkg
        Pkg.develop(PackageSpec(path=pwd()))
        Pkg.instantiate()
        using Documenter: doctest
        using CosmoReaderBase
        doctest(CosmoReaderBase)
        include("docs/make.jl")'
    - mkdir -p public
    - mv docs/build public/dev
  artifacts:
    paths:
      - public
  only:
    - main
